<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B3D8F" />

    <!-- ══════════════════════════════════════════════════════════════
         FAVICON & APP ICONS
         ── Place these files in your /public folder:
            /public/favicon.ico          (32×32 multi-size ICO)
            /public/favicon-16x16.png    (16×16 PNG)
            /public/favicon-32x32.png    (32×32 PNG)
            /public/apple-touch-icon.png (180×180 PNG — iOS home screen)
            /public/android-chrome-192.png (192×192 PNG)
            /public/android-chrome-512.png (512×512 PNG)
            /public/site.webmanifest     (see template below)

         Recommended tool to generate all sizes instantly:
         https://realfavicongenerator.net  (upload your logo PNG)
    ════════════════════════════════════════════════════════════════ -->
    <link rel="icon" type="image/x-icon"      href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16"  href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32"  href="/favicon-32x32.png" />
    <link rel="apple-touch-icon"      sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ══════════════════════════════════════════════════════════════
         SEARCH ENGINE LOGO (Google Knowledge Panel)
         Google uses the Organisation schema "logo" field below.
         The og:image is shown on social shares (WhatsApp, LinkedIn, X).
         Both must be publicly accessible absolute HTTPS URLs.
         Recommended og:image size: 1200×630 px
    ════════════════════════════════════════════════════════════════ -->

    <!-- ── PRIMARY META ───────────────────────────────────────────── -->
    <meta name="description" content="Baylem Ltd supplies and installs WHO-compliant cold chain systems, histopathology laboratories, mortuary infrastructure, and blood bank refrigeration across Kenya and East Africa. 30+ years of proven healthcare and industrial refrigeration expertise." />
    <meta name="keywords" content="cold chain Kenya, vaccine cold room Kenya, blood bank refrigeration, histopathology laboratory Kenya, mortuary equipment Kenya, ULT freezers East Africa, WHO PQS cold room, walk-in cold room Nairobi, pathology equipment Kenya, Baylem" />
    <meta name="author" content="Baylem Ltd" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.baylem.com/" />

    <!-- ── OPEN GRAPH (Facebook, LinkedIn, WhatsApp) ──────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Baylem Ltd" />
    <meta property="og:title"       content="Baylem Ltd · Cold Chain & Pathology Solutions — Kenya & East Africa" />
    <meta property="og:description" content="Specialists in WHO-compliant vaccine cold rooms, blood bank refrigeration, histopathology laboratories, and mortuary infrastructure. Serving 47+ counties across Kenya for over 30 years." />
    <meta property="og:url"         content="https://www.baylem.com/" />
    <meta property="og:image"       content="https://www.baylem.com/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="Baylem Ltd — Cold Chain and Pathology Solutions across Kenya" />
    <meta property="og:locale"      content="en_KE" />

    <!-- ── TWITTER / X CARD ───────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Baylem Ltd · Cold Chain & Pathology Solutions — Kenya & East Africa" />
    <meta name="twitter:description" content="WHO-compliant cold rooms, blood bank refrigeration, histopathology labs, and mortuary infrastructure. 30+ years serving Kenya's health sector." />
    <meta name="twitter:image"       content="https://www.baylem.com/og-image.jpg" />
    <meta name="twitter:image:alt"   content="Baylem Ltd — Cold Chain and Pathology Solutions" />

    <!-- ── GEO & REGIONAL ─────────────────────────────────────────── -->
    <meta name="geo.region"    content="KE" />
    <meta name="geo.placename" content="Nairobi, Kenya" />
    <meta name="geo.position"  content="-1.286389;36.817223" />
    <meta name="ICBM"          content="-1.286389, 36.817223" />

    <!-- ── STRUCTURED DATA — Organisation + LocalBusiness ───────── -->
    <!--
      The "logo" field here is what Google uses to display your logo
      in search results and the Knowledge Panel.
      Requirements:
        • Publicly accessible HTTPS URL
        • At least 112×112 px; square preferred
        • PNG or JPG (no SVG for logo schema)
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["LocalBusiness", "Organization"],
      "name": "Baylem Ltd",
      "description": "Specialists in WHO-compliant vaccine cold rooms, blood bank refrigeration, histopathology laboratories, mortuary infrastructure, and industrial cold chain systems across Kenya and East Africa.",
      "url": "https://www.baylem.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.baylem.com/logo.png",
        "width": 512,
        "height": 512
      },
      "image": "https://www.baylem.com/og-image.jpg",
      "telephone": "+254-726-128-040",
      "email": "info@baylem.com",
      "foundingDate": "1997",
      "areaServed": {
        "@type": "Country",
        "name": "Kenya"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Nairobi",
        "addressCountry": "KE"
      },
      "sameAs": [],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Cold Chain & Pathology Solutions",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Vaccine & Pharmaceutical Cold Rooms",
              "description": "WHO PQS-compliant walk-in cold rooms for vaccine and pharmaceutical storage."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Blood Bank Refrigeration",
              "description": "Dedicated blood bank refrigerators, platelet agitators, and plasma freezers."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Histopathology Laboratory Equipment",
              "description": "Tissue processors, microtomes, cryostats, and embedding stations."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Mortuary Infrastructure",
              "description": "Stainless steel body storage, mortuary refrigeration, and autopsy suites."
            }
          }
        ]
      }
    }
    </script>

    <!-- ── FONTS ──────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Baylem Ltd · Cold Chain & Pathology Solutions — Kenya & East Africa</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
